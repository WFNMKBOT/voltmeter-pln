name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Tentukan Versi Rilis Otomatis
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          sed -i "s/__APP_VERSION__/$TAG/g" www/index.html

      - name: Install Dependencies & Init Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Generate Icon & Splash Screen (Jika Ada)
        run: |
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#06090e' --splashBackgroundColor '#06090e'
          fi

      - name: Set Version Code & Name di Gradle
        run: |
          sed -i "s/versionCode 1/versionCode ${{ steps.version.outputs.code }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.version.outputs.tag }}\"/g" android/app/build.gradle

      - name: Build & Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release-key.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../VoltMeter-${{ steps.version.outputs.tag }}.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../VoltMeter-${{ steps.version.outputs.tag }}-debug.apk
          fi

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltMeter-${{ steps.version.outputs.tag }}
          path: VoltMeter-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VoltMeter Live ${{ steps.version.outputs.tag }}
          body: |
            Rilis otomatis **VoltMeter Live ${{ steps.version.outputs.tag }}**:
            - Live kWh Meter Real-time dengan sakelar ON/OFF per perangkat
            - Input manual & katalog 25+ alat elektronik rumah tangga
            - Kalkulator Token PLN & Radar Beban Puncak MCB
          files: VoltMeter-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
